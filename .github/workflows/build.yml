name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 直接使用自带完整安卓环境的 Docker 镜像，完美避开 SDK 报错
    runs-on: ubuntu-latest
    container:
      image: androidsdk/android-30:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Project Structure
      run: |
        mkdir -p app/src/main/java/com/sky/jsonparser
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

    - name: Create App Config
      run: |
        cat > settings.gradle << 'EOF'
        rootProject.name = "SkyJsonApp"
        include ':app'
        EOF

        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.0.4' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.sky.jsonparser'
            compileSdk 30
            defaultConfig {
                applicationId "com.sky.jsonparser"
                minSdk 24
                targetSdk 30
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.3.1'
        }
        EOF

        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="光遇传送点"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Create WebView Activity
      run: |
        cat > app/src/main/java/com/sky/jsonparser/MainActivity.java << 'EOF'
        package com.sky.jsonparser;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                
                // 加载本地的 index.html
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

    - name: Copy HTML to Assets
      run: |
        # 将你的网页放入安卓资源目录
        cp index.html app/src/main/assets/index.html

    - name: Build APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyJson-App-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
