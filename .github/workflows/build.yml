name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.4'

    - name: Setup Project Structure
      run: |
        mkdir -p app/src/main/java/com/point/transport
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/assets

    - name: Generate App Icon (极限压缩)
      run: |
        sudo apt-get update && sudo apt-get install -y imagemagick
        # 强制把图片压缩成 192x192 的 png，多余像素全部删掉
        convert app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

    - name: Create App Config
      run: |
        cat > settings.gradle << 'EOF'
        rootProject.name = "SkyPortal"
        include ':app'
        EOF

        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 【瘦身核心】：开启代码压缩、资源压缩，移除无用架构
        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.point.transport'
            compileSdk 34
            defaultConfig {
                applicationId "com.point.transport"
                minSdk 24
                targetSdk 34
                versionCode 3
                versionName "0.0.3.1"
                ndk {
                    abiFilters 'armeabi-v7a', 'arm64-v8a'
                }
            }
            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
        }
        EOF

        # 创建空的混淆规则文件
        cat > app/proguard-rules.pro << 'EOF'
        -dontwarn android.**
        -keep class com.point.transport.** { *; }
        EOF

        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.point.transport">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application
                android:allowBackup="true"
                android:label="SkyPortal"
                android:icon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Create WebView Activity with FileChooser Fix
      run: |
        cat > app/src/main/java/com/point/transport/MainActivity.java << 'EOF'
        package com.point.transport;

        import android.app.Activity;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private static final int FILE_CHOOSER_REQUEST_CODE = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webView.setWebViewClient(new WebViewClient());

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        if (MainActivity.this.filePathCallback != null) {
                            MainActivity.this.filePathCallback.onReceiveValue(null);
                        }
                        MainActivity.this.filePathCallback = filePathCallback;
                        
                        // 【纯净选择器】：强制使用 ACTION_OPEN_DOCUMENT 唤起系统纯净文件管理器
                        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("*/*");
                        
                        // 过滤掉相册等无关应用
                        String[] mimeTypes = {"application/json", "text/plain", "text/*"};
                        intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
                        
                        // 默认打开 Download 目录
                        Uri initialUri = Uri.parse("content://com.android.externalstorage.documents/document/primary%3ADownload");
                        intent.putExtra("android.provider.extra.INITIAL_URI", initialUri);
                        
                        try {
                            startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                        } catch (Exception e) {
                            MainActivity.this.filePathCallback = null;
                            return false;
                        }
                        return true;
                    }
                });

                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                    if (filePathCallback == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) results = new Uri[]{ Uri.parse(dataString) };
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                } else {
                    super.onActivityResult(requestCode, resultCode, data);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        EOF

    - name: Copy Frontend Files to Assets
      run: |
        cp index.html app/src/main/assets/index.html
        cp online_dict.json app/src/main/assets/online_dict.json

    - name: Build with Gradle
      run: gradle assembleRelease

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/SkyPortal_v0.0.3.1.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyPortal-APK
        path: app/build/outputs/apk/release/SkyPortal_v0.0.3.1.apk
