- name: Create WebView Activity with FileChooser Fix
  run: |
    cat > app/src/main/java/com/sky/jsonparser/MainActivity.java << 'EOF'
    package com.sky.jsonparser;

    import android.app.Activity;
    import android.content.Intent;
    import android.net.Uri;
    import android.os.Bundle;
    import android.webkit.ValueCallback;
    import android.webkit.WebChromeClient;
    import android.webkit.WebSettings;
    import android.webkit.WebView;
    import android.webkit.WebViewClient;

    public class MainActivity extends Activity {
        private WebView webView;
        private ValueCallback<Uri[]> filePathCallback;
        private static final int FILE_CHOOSER_REQUEST_CODE = 1;

        @Override
        protected void onCreate(Bundle savedInstanceState) {
            super.onCreate(savedInstanceState);
            webView = new WebView(this);
            WebSettings webSettings = webView.getSettings();
            webSettings.setJavaScriptEnabled(true);
            webSettings.setDomStorageEnabled(true);
            webSettings.setAllowFileAccess(true);
            webSettings.setAllowContentAccess(true);
            webView.setWebViewClient(new WebViewClient());

            webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                    if (MainActivity.this.filePathCallback != null) {
                        MainActivity.this.filePathCallback.onReceiveValue(null);
                    }
                    MainActivity.this.filePathCallback = filePathCallback;
                    
                    // 1. 标准文件获取动作
                    Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                    
                    // 【核心黑科技】：严格限制文件类型为 JSON 和纯文本，这样相册和相机就会被过滤掉！
                    intent.setType("*/*");
                    String[] mimeTypes = {"application/json", "text/plain", "text/*"};
                    intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
                    
                    // 2. 强制拉起系统的应用选择器
                    Intent chooser = Intent.createChooser(intent, "请选择文件管理器");
                    
                    try {
                        startActivityForResult(chooser, FILE_CHOOSER_REQUEST_CODE);
                    } catch (Exception e) {
                        MainActivity.this.filePathCallback = null;
                        return false;
                    }
                    return true;
                }
            });

            webView.loadUrl("file:///android_asset/index.html");
            setContentView(webView);
        }

        @Override
        protected void onActivityResult(int requestCode, int resultCode, Intent data) {
            if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                if (filePathCallback == null) return;
                Uri[] results = null;
                if (resultCode == Activity.RESULT_OK && data != null) {
                    String dataString = data.getDataString();
                    if (dataString != null) results = new Uri[]{ Uri.parse(dataString) };
                }
                filePathCallback.onReceiveValue(results);
                filePathCallback = null;
            } else {
                super.onActivityResult(requestCode, resultCode, data);
            }
        }

        @Override
        public void onBackPressed() {
            if (webView.canGoBack()) webView.goBack();
            else super.onBackPressed();
        }
    }
    EOF
