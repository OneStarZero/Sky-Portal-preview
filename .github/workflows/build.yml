name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.4'

    - name: Setup Project Structure
      run: |
        mkdir -p app/src/main/java/com/sky/jsonparser
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/assets

    # ================= 自动生成应用图标 =================
    - name: Generate App Icon
      run: |
        # 安装图片处理工具
        sudo apt-get update && sudo apt-get install -y imagemagick
        # 用代码画一个 512x512 的深色背景
        convert -size 512x512 xc:'#0a0a0c' app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        # 在深色背景上画一个发光渐变的绿色圆环和蓝色圆环
        convert app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
                -fill 'rgba(0,255,170,0.4)' -draw "circle 256,256 256,100" \
                -fill 'rgba(58,102,255,0.4)' -draw "circle 256,256 256,180" \
                -blur 0x40 \
                -fill white -pointsize 160 -gravity center -annotate +0+0 "✨" \
                app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

    - name: Create App Config
      run: |
        cat > settings.gradle << 'EOF'
        rootProject.name = "SkyJsonApp"
        include ':app'
        EOF

        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.sky.jsonparser'
            compileSdk 34
            defaultConfig {
                applicationId "com.sky.jsonparser"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        dependencies {
        }
        EOF

        # 在这里指定使用我们生成的图标
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application
                android:allowBackup="true"
                android:label="光遇传送点"
                android:icon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Create WebView Activity with FileChooser Fix
      run: |
        cat > app/src/main/java/com/sky/jsonparser/MainActivity.java << 'EOF'
        package com.sky.jsonparser;

        import android.app.Activity;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private static final int FILE_CHOOSER_REQUEST_CODE = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webView.setWebViewClient(new WebViewClient());

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        if (MainActivity.this.filePathCallback != null) {
                            MainActivity.this.filePathCallback.onReceiveValue(null);
                        }
                        MainActivity.this.filePathCallback = filePathCallback;
                        Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("*/*");
                        try {
                            startActivityForResult(Intent.createChooser(intent, "请选择 JSON 文件"), FILE_CHOOSER_REQUEST_CODE);
                        } catch (Exception e) {
                            MainActivity.this.filePathCallback = null;
                            return false;
                        }
                        return true;
                    }
                });

                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                    if (filePathCallback == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) results = new Uri[]{ Uri.parse(dataString) };
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                } else {
                    super.onActivityResult(requestCode, resultCode, data);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        EOF

    - name: Copy HTML to Assets
      run: |
        cp index.html app/src/main/assets/index.html

    - name: Build with Gradle
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyJson-App-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
