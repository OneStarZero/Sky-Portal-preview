<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>光遇传送点解析</title>

    <!-- ========================================== -->
    <!-- 1. 核心 CSS 样式区                          -->
    <!-- ========================================== -->
    <style>
        /* 全局变量 */
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(28, 28, 35, 0.85);
            --text-main: #ffffff;
            --text-sub: #a0a0b0;
            --accent-green: #00ffaa;
            --accent-red: #ff4466;
            --btn-blue: #3a66ff;
            --border-radius: 16px;
        }

        /* 基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* 页面主体 */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            display: flex;
            flex-direction: column;
            transform: translate3d(0, 0, 0);
            -webkit-overflow-scrolling: touch;
        }

        /* ================= 极光背景 ================= */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.4;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            animation: float 20s infinite alternate ease-in-out;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }
        .blob-1 { width: 200px; height: 200px; background: #00ffaa; top: -5%; left: -5%; }
        .blob-2 { width: 250px; height: 250px; background: #3a66ff; bottom: 5%; right: -10%; animation-delay: -7s; }
        @keyframes float {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(40px, 60px, 0) scale(1.1); }
        }

        /* ================= 顶部导入栏 ================= */
        .top-bar {
            flex-shrink: 0;
            padding: 15px 15px 10px 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            z-index: 10;
        }
        .btn-import {
            width: 100%;
            background: linear-gradient(135deg, #3a66ff, #6a33ff);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(58, 102, 255, 0.2);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translate3d(0, 0, 0);
        }
        .btn-import:active { transform: scale(0.95) translate3d(0, 0, 0); }

        /* ================= 核心列表区 ================= */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 10px 15px;
            position: relative;
        }

        /* ================= 高定卡片 ================= */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translate3d(0, 0, 0);
            will-change: transform;
            box-shadow: inset 4px 0 0 0 transparent;
        }
        .card:active {
            transform: scale(0.96) translate3d(0, 0, 0);
            background: rgba(40, 40, 50, 0.9);
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translate3d(0, 20px, 0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .card-anim { animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
        .card.enabled { box-shadow: inset 4px 0 0 0 var(--accent-green); }
        .card.disabled { box-shadow: inset 4px 0 0 0 var(--accent-red); }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            word-break: break-all;
            line-height: 1.4;
            display: flex;
            align-items: center;
        }
        .card.enabled .card-title { color: var(--accent-green); }
        .card.disabled .card-title { color: var(--accent-red); }

        .card-level {
            font-size: 14px;
            color: #d0d0d5;
            margin-bottom: 10px;
            line-height: 1.4;
            display: flex;
        }
        .card-level::before {
            content: "目的地";
            color: var(--text-sub);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            height: fit-content;
            margin-top: 1px;
        }

        .card-coord {
            font-size: 13px;
            font-family: "SFMono-Regular", Consolas, monospace;
            color: #888;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        .card-coord span { color: #fff; font-weight: 600; }

        /* ================= 底部搜索与选项卡 ================= */
        .search-bar {
            flex-shrink: 0;
            padding: 0 15px 10px 15px;
            display: none;
        }
        .search-input-wrap {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            padding: 0 15px;
            transition: border-color 0.2s;
        }
        .search-input-wrap:focus-within { border-color: var(--btn-blue); }
        .search-input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 15px 0;
            font-size: 15px;
            outline: none;
        }
        .btn-clear {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            padding: 10px;
            display: none;
        }

        .tabs {
            flex-shrink: 0;
            padding: 10px 15px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            display: none;
            gap: 12px;
            background: var(--bg-color);
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 600;
            background: var(--card-bg);
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.15s, background-color 0.2s, color 0.2s;
            transform: translate3d(0, 0, 0);
        }
        .tab-btn:active { transform: scale(0.95) translate3d(0, 0, 0); }
        .tab-btn.active-avail { background: rgba(0, 255, 170, 0.1); color: var(--accent-green); border-color: rgba(0, 255, 170, 0.2); }
        .tab-btn.active-dis { background: rgba(255, 68, 102, 0.1); color: var(--accent-red); border-color: rgba(255, 68, 102, 0.2); }

        /* ================= 弹窗与动画 ================= */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(40, 40, 50, 0.95);
            color: white;
            padding: 16px 32px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            will-change: transform, opacity;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple-anim 0.4s ease-out;
            pointer-events: none;
            will-change: transform, opacity;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        .skeleton {
            background: #1a1a20;
            border-radius: var(--border-radius);
            height: 110px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }
        .skeleton::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 1.2s infinite;
            transform: translate3d(-100%, 0, 0);
        }
        @keyframes shimmer { 100% { transform: translate3d(100%, 0, 0); } }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 2. HTML 结构区                              -->
    <!-- ========================================== -->
    
    <div class="aurora-bg">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>

    <div class="top-bar">
        <button class="btn-import" id="importBtn">📂 导入光遇 JSON 文件</button>

    </div>

    <div class="search-bar" id="searchBar">

            <button class="btn-clear" id="btnClear">×</button>
        </div>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab-btn active-avail" id="tabAvail">可用传送点 (0)</button>

            // ================== 伊甸与重生之路 ==================

            // ================== 云巢 (原主街) ==================
            "MainStreet": "云巢", 
            "MainStreet_Apartment": "云巢·公寓",

            "Event_Cinema": "活动·剧场", 
            "Event_DaysOfMischief": "活动·恶作剧之日", 
            "Event_DaysOfMischief_Escape": "活动·恶作剧逃脱",
            "Event_DaysOfMoonlight_HugeMoon": "活动·月光日(巨月)", 
            "Event_HidenSeek_SnowVillage": "活动·捉迷藏雪村", 
            "Event_Personality": "活动·性格测试", 
            "Event_WerewolfGame": "活动·狼人杀",
            "Event_Arr_ExhaleInhale": "欧若拉·呼吸", 
            "Event_Arr_EyesOfAChild": "欧若拉·孩童之眼", 
            "Event_Arr_Runaway": "欧若拉·逃跑",
            "Event_Arr_SoftInside": "欧若拉·柔软内心", 
            "Event_Arr_TheSeed": "欧若拉·种子", 
            "Event_Arr_Warrior": "欧若拉·战士"
        };

        // =====================================================================
        // 🧠 翻译系统状态
        // =====================================================================
        let ONLINE_TRANSLATIONS = {}; 
        let IS_ONLINE_MODE = false;   
        let SORTED_KEYS = [];         

        function updateSortedKeys() {
            let combined = Object.assign({}, LOCAL_TRANSLATIONS, ONLINE_TRANSLATIONS);
            SORTED_KEYS = Object.keys(combined).sort((a, b) => b.length - a.length);
        }
        updateSortedKeys();

        function fetchOnlineDict() {
            if (!navigator.onLine) return;
            fetch(GITHUB_ONLINE_DICT_URL + "?t=" + Date.now())
                .then(res => {
                    if(!res.ok) throw new Error("网络不佳");
                    return res.json();
                })
                .then(data => {
                    ONLINE_TRANSLATIONS = data;
                    IS_ONLINE_MODE = true;
                    updateSortedKeys();
                })
                .catch(err => console.log("在线词典加载失败", err));
        }

        fetchOnlineDict();
        window.addEventListener('online', fetchOnlineDict);

        // =====================================================================
        // 🛠️ 核心翻译引擎
        // =====================================================================
        function translateLevel(rawName) {
            if (!rawName) return "未知";
            
            let activeDict = IS_ONLINE_MODE ? Object.assign({}, LOCAL_TRANSLATIONS, ONLINE_TRANSLATIONS) : LOCAL_TRANSLATIONS;
            
            if (activeDict[rawName]) return `${rawName} (${activeDict[rawName]})`;

            let cleanName = rawName.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            for (let key of SORTED_KEYS) {
                let cleanKey = key.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                if (cleanKey && cleanName.includes(cleanKey)) {
                    return `${rawName} (${activeDict[key]})`;
                }
            }

            const BASE_WORDS = { 
                "SeasonOf": "季节", "Event": "活动", "Dawn": "晨岛", "Prairie": "云野", "Rain": "雨林", 
                "Sunset": "霞谷", "Dusk": "暮土", "Night": "禁阁", "Cave": "洞穴", "Temple": "神庙", 
                "Island": "岛屿", "Village": "村庄", "Forest": "森林", "Theater": "剧场", "Shop": "商店", 
                "Star": "星", "Light": "光", "DaysOf": "之日" 
            };
            const words = rawName.match(/[A-Z]?[a-z]+|[A-Z]+(?=[A-Z]|$)/g) || [];
            const translatedParts = [];
            
            for (let w of words) {
                let translated = activeDict[w] || BASE_WORDS[w];
                if (["Of", "The", "And", "To", "From"].includes(w)) continue; 
                if (translated && !translatedParts.includes(translated)) translatedParts.push(translated);
            }
            if (translatedParts.length > 0) {
                return `${rawName} (${translatedParts.slice(0, 3).join('·')})`;
            }

            return rawName;
        }

        // =====================================================================
        // 🎵 音频控制系统
        // =====================================================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let lastPlayTime = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastPlayTime < 120) return; // 音效防抖
            lastPlayTime = now;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;

            switch(type) {
                case 'tap': 
                    osc.type='sine'; osc.frequency.setValueAtTime(400,t); 
                    osc.frequency.exponentialRampToValueAtTime(600,t+0.05); 
                    gain.gain.setValueAtTime(0.15,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); 
                    osc.start(t); osc.stop(t+0.1); 
                    break;
                case 'tab': 
                    osc.type='triangle'; osc.frequency.setValueAtTime(300,t); 
                    osc.frequency.exponentialRampToValueAtTime(800,t+0.1); 
                    gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15); 
                    osc.start(t); osc.stop(t+0.15); 
                    break;
                case 'success': 
                    osc.type='sine'; osc.frequency.setValueAtTime(800,t); 
                    osc.frequency.setValueAtTime(1200,t+0.1); 
                    gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); 
                    osc.start(t); osc.stop(t+0.3); 
                    break;
            }
        }

        // =====================================================================
        // 🚀 主业务逻辑
        // =====================================================================
        let parsedData = { enabled: [], disabled: [] };
        let currentTab = 'enabled';

        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');
        const listContainer = document.getElementById('listContainer');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');
        const btnClear = document.getElementById('btnClear');
        const tabs = document.getElementById('tabs');
        const tabAvail = document.getElementById('tabAvail');
        const tabDis = document.getElementById('tabDis');
        const toast = document.getElementById('toast');

        document.body.addEventListener('touchstart', initAudio, { once: true, passive: true });
        document.body.addEventListener('mousedown', initAudio, { once: true });

        importBtn.addEventListener('click', () => { 
            if (importBtn.innerText.includes("正在解析")) return;
            playSound('tap'); 
            fileInput.value = ''; 
            fileInput.click(); 
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            listContainer.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
            importBtn.innerText = "⏳ 正在解析...";
            
            const reader = new FileReader();
            reader.onload = (event) => { 
                try {
                    const data = JSON.parse(event.target.result);
                    processData(data); 
                    playSound('success');
                } catch (err) {
                    alert("解析失败！");
                    importBtn.innerText = "📂 导入光遇 JSON 文件";
                    listContainer.innerHTML = "";
                }
            };
            reader.readAsText(file);
        });

        function processData(data) { 
            parsedData.enabled = [];
            parsedData.disabled = [];
            const bstNodes = data.BSTNodes || {};

            for (let key in bstNodes) {
                let node = bstNodes[key];
                if (!node || !node.LevelLink) continue;
                
                let link = node.LevelLink;
                let tf = link.transform;
                if (!tf) continue;

                let mx = 0, my = 0, mz = 0;
                try {
                    if (Array.isArray(tf) && tf.length >= 4) {
                        mx = parseFloat(tf[3][0]); 
                        my = parseFloat(tf[3][1]); 
                        mz = parseFloat(tf[3][2]);
                        if (mx === 0 && my === 0 && mz === 0) {
                            mx = parseFloat(tf[0][3]); 
                            my = parseFloat(tf[1][3]); 
                            mz = parseFloat(tf[2][3]);
                        }
                    }
                } catch (e) { continue; }
                if (mx === 0 && my === 0 && mz === 0) continue;

                let translatedLevel = translateLevel(link.levelName || "未知");

                let item = {
                    name: link.linkName || "未知",
                    level: translatedLevel,
                    x: mx.toFixed(1), z: my.toFixed(1), y: mz.toFixed(1)
                };

                if (link.enabled === true || link.enabled === 1 || link.enabled === "true") {
                    parsedData.enabled.push(item);
                } else {
                    parsedData.disabled.push(item);
                }
            }

            importBtn.innerText = "✅ 解析完成！点击重新导入";
            importBtn.style.background = "linear-gradient(135deg, #00b09b, #96c93d)";
            searchBar.style.display = "block";
            tabs.style.display = "flex";
            
            tabAvail.innerText = `可用 (${parsedData.enabled.length})`;
            tabDis.innerText = `禁用 (${parsedData.disabled.length})`;
            
            switchTab('enabled');
        }

        tabAvail.addEventListener('click', () => { playSound('tab'); switchTab('enabled'); });
        tabDis.addEventListener('click', () => { playSound('tab'); switchTab('disabled'); });

        function switchTab(type) {
            currentTab = type;
            if (type === 'enabled') {
                tabAvail.className = "tab-btn active-avail";
                tabDis.className = "tab-btn";
            } else {
                tabAvail.className = "tab-btn";
                tabDis.className = "tab-btn active-dis";
            }
            renderList();
        }

        let searchTimer;
        searchInput.addEventListener('input', () => {
            btnClear.style.display = searchInput.value ? "block" : "none";
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderList, 100);
        });

        btnClear.addEventListener('click', () => {
            searchInput.value = "";
            btnClear.style.display = "none";
            renderList();
        });

        function renderList() {
            const fragment = document.createDocumentFragment();
            let sourceData = currentTab === 'enabled' ? parsedData.enabled : parsedData.disabled;
            
            let keyword = searchInput.value.trim().toLowerCase();
            if (keyword) {
                sourceData = sourceData.filter(item => 
                    item.name.toLowerCase().includes(keyword) || item.level.toLowerCase().includes(keyword)
                );
            }

            if (sourceData.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:#666; margin-top:50px;">没有找到匹配的传送点</div>`;
                return;
            }

            sourceData.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = `card ${currentTab} card-anim`;
                card.style.animationDelay = `${Math.min(index * 0.015, 0.3)}s`; 
                
                card.innerHTML = `
                    <div class="card-title">[${currentTab === 'enabled' ? '可用' : '不可用'}] ${item.name}</div>
                    <div class="card-level">${item.level}</div>
                    <div class="card-coord">X <span>${item.x}</span> | Z <span>${item.z}</span> | Y <span>${item.y}</span></div>
                `;

                bindCardEvents(card, item);
                fragment.appendChild(card);
            });

            listContainer.innerHTML = "";
            listContainer.appendChild(fragment);
        }

        function bindCardEvents(card, item) {
            let timer;
            let isSoundPlayed = false;

            const startPress = (e) => {
                if (isSoundPlayed) return;
                isSoundPlayed = true;
                setTimeout(() => { isSoundPlayed = false; }, 150);

                playSound('tap');
                createRipple(e, card);
                timer = setTimeout(() => { 
                    playSound('success'); 
                    copyToClipboard(item); 
                }, 1000);
            };
            const endPress = () => clearTimeout(timer);

            card.addEventListener('pointerdown', startPress);
            card.addEventListener('pointerup', endPress);
            card.addEventListener('pointerleave', endPress);
            card.addEventListener('pointercancel', endPress);
            
            if (!window.PointerEvent) {
                card.addEventListener('touchstart', startPress, {passive: true});
                card.addEventListener('touchend', endPress);
                card.addEventListener('touchmove', endPress);
            }
        }

        function createRipple(event, card) {
            const rect = card.getBoundingClientRect();
            let x, y;
            if (event.clientX !== undefined) {
                x = event.clientX - rect.left; y = event.clientY - rect.top;
            } else if (event.touches && event.touches.length > 0) {
                x = event.touches[0].clientX - rect.left; y = event.touches[0].clientY - rect.top;
            } else { return; }
            
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${x}px`; ripple.style.top = `${y}px`;
            ripple.style.width = ripple.style.height = '150px';
            ripple.style.marginLeft = '-75px'; ripple.style.marginTop = '-75px';
            
            card.appendChild(ripple);
            setTimeout(() => { if (ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 400);
        }

        function copyToClipboard(item) {
            const text = `${item.name} | 目的地: ${item.level} | 坐标: X ${item.x}, Z ${item.z}, Y ${item.y}`;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showToast);
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = text; textArea.style.position = "fixed";
                document.body.appendChild(textArea); textArea.focus(); textArea.select();
                try { document.execCommand('copy'); showToast(); } catch (err) {}
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
