<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Portal preview</title>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-bg: #1a1a1f;
            --text-main: #e0e0e0;
            --text-sub: #88888f;
            --accent-green: #2aff99;
            --accent-red: #ff5555;
            --btn-blue: #3366ff;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            overflow: hidden; /* 锁定整体滚动 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 顶部导入栏 */
        .top-bar {
            flex-shrink: 0;
            padding: 15px 15px 10px 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            background-color: var(--bg-color);
            z-index: 10;
        }

        .btn-import {
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 12px rgba(51, 102, 255, 0.3);
            transition: transform 0.1s;
        }
        .btn-import:active { transform: scale(0.97); }

        /* 核心列表区 */
        .list-container {
            flex: 1;
            overflow-y: auto; /* 列表内部滚动 */
            padding: 0 15px 10px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s;
        }
        .card:active { transform: scale(0.98); }
        .card.enabled { border-left: 4px solid var(--accent-green); }
        .card.disabled { border-left: 4px solid var(--accent-red); }

        .card-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .card.enabled .card-title { color: var(--accent-green); }
        .card.disabled .card-title { color: var(--accent-red); }

        .card-level {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .card-coord {
            font-size: 14px;
            font-family: monospace;
            color: #aaa;
        }
        .card-coord span { color: white; font-weight: bold; }

        /* 搜索栏 */
        .search-bar {
            flex-shrink: 0;
            padding: 0 15px 10px 15px;
            display: none; /* 初始隐藏 */
        }

        .search-input-wrap {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search-input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 14px 0;
            font-size: 15px;
            outline: none;
        }

        .btn-clear {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            padding: 10px;
            display: none;
        }

        /* 底部选项卡 */
        .tabs {
            flex-shrink: 0;
            padding: 10px 15px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            background-color: var(--bg-color);
            display: none; /* 初始隐藏 */
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: bold;
            background-color: #222;
            color: #888;
            transition: all 0.2s;
        }

        .tab-btn.active-avail { background-color: rgba(42, 255, 153, 0.15); color: var(--accent-green); }
        .tab-btn.active-dis { background-color: rgba(255, 85, 85, 0.15); color: var(--accent-red); }

        /* 悬浮提示 Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(30, 30, 35, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 999;
        }
        .toast.show { opacity: 1; }

        /* 涟漪动画 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
    </style>
</head>
<body>

    <!-- 顶部导入 -->
    <div class="top-bar">
        <button class="btn-import" id="importBtn">📂 导入光遇 JSON 文件</button>
        <input type="file" id="fileInput" accept=".json" style="display: none;">
    </div>

    <!-- 列表区 -->
    <div class="list-container" id="listContainer">
        <!-- 卡片将由 JS 动态生成 -->
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar" id="searchBar">
        <div class="search-input-wrap">
            <input type="text" id="searchInput" placeholder="搜索传送点或目的地...">
            <button class="btn-clear" id="btnClear">×</button>
        </div>
    </div>

    <!-- 底部选项卡 -->
    <div class="tabs" id="tabs">
        <button class="tab-btn active-avail" id="tabAvail">可用传送点 (0)</button>
        <button class="tab-btn" id="tabDis">禁用传送点 (0)</button>
    </div>

    <!-- 提示框 -->
    <div class="toast" id="toast">已复制到剪贴板！</div>

    <script>
        // 精准翻译库
        const TRANSLATIONS = {
            "CandleSpace": "遇境", "Dawn": "晨岛", "Island": "晨岛", "Prairie": "云野",
            "RainForest": "雨林", "HiddenForest": "雨林·隐藏图", "SunsetVillage": "霞谷·村落",
            "NightDesert": "暮土·荒漠", "Dusk_Triangle": "禁阁", "Eden": "伊甸", "Eye_of_Eden": "暴风眼",
            "Prairie_Island": "云野·圣岛", "SanctuaryIslands": "云野·圣岛",
            "Prairie_ButterflyFields": "云野·蝴蝶平原", "Prairie_Cave": "云野·洞穴",
            "Prairie_Temple": "云野·神庙", "TGCOffice": "TGC办公室", "Office": "办公室",
            "SunsetVillage_Winterbreak": "霞谷·村落（冬日）", "SunsetVillage_MusicShop": "霞谷·音乐商店",
            "Sunset_YetiPark": "霞谷·隐士山谷", "SunsetColiseum": "霞谷·竞技场",
            "VillageOfDreams": "霞谷·圆梦村", "Hermit_Valley": "霞谷·隐士山谷",
            "MainStreet_ShopOutfits": "云野·主街服装店", "MainStreet_MusicShop": "云野·主街音乐商店",
            "MainStreet_DyeShop": "云野·主街染料店", "MainStreet_Cafe": "云野·主街咖啡厅",
            "MainStreet_PantsShop": "云野·主街裤子店", "MainStreet_ShopSpells": "云野·主街魔法商店",
            "MainStreet": "云野·主街", "Market": "市集",
            "Boneyard": "暮土·巨兽荒原", "Battlefield": "暮土·古战场", "Shipwreck": "暮土·沉船",
            "Forgotten_Ark": "暮土·遗忘方舟", "Starlight_Desert": "禁阁·星漠",
            "DuskOasis": "禁阁·绿洲", "NightArchive": "暮土·档案馆",
            "Event_Cinema": "活动·剧场", "Event_Cafe": "活动·咖啡厅",
            "RainForest_Shelter": "雨林·树屋", "Shelter": "树屋", "Cave": "洞穴", "Temple": "神庙",
            "OrbitEnd": "伊甸之眼(终点)", "Skyway": "云道"
        };

        function translateLevel(rawName) {
            if (!rawName) return "未知";
            if (TRANSLATIONS[rawName]) return `${rawName} (${TRANSLATIONS[rawName]})`;
            let cleanName = rawName.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            const sortedKeys = Object.keys(TRANSLATIONS).sort((a, b) => b.length - a.length);
            for (let key of sortedKeys) {
                let cleanKey = key.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                if (cleanKey && cleanName.includes(cleanKey)) {
                    return `${rawName} (${TRANSLATIONS[key]})`;
                }
            }
            return rawName;
        }

        let parsedData = { enabled: [], disabled: [] };
        let currentTab = 'enabled';

        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');
        const listContainer = document.getElementById('listContainer');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');
        const btnClear = document.getElementById('btnClear');
        const tabs = document.getElementById('tabs');
        const tabAvail = document.getElementById('tabAvail');
        const tabDis = document.getElementById('tabDis');
        const toast = document.getElementById('toast');

        importBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            importBtn.innerText = "⏳ 正在解析...";
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    processData(data);
                } catch (err) {
                    alert("解析失败，请确保是有效的 JSON 文件！");
                    importBtn.innerText = "📂 导入光遇 JSON 文件";
                }
            };
            reader.readAsText(file);
        });

        function processData(data) {
            parsedData.enabled = [];
            parsedData.disabled = [];
            const bstNodes = data.BSTNodes || {};

            for (let key in bstNodes) {
                let node = bstNodes[key];
                if (!node || !node.LevelLink) continue;
                
                let link = node.LevelLink;
                let tf = link.transform;
                if (!tf) continue;

                let mx = 0, my = 0, mz = 0;
                try {
                    if (Array.isArray(tf) && tf.length >= 4) {
                        mx = parseFloat(tf[3][0]);
                        my = parseFloat(tf[3][1]);
                        mz = parseFloat(tf[3][2]);
                        if (mx === 0 && my === 0 && mz === 0) {
                            mx = parseFloat(tf[0][3]);
                            my = parseFloat(tf[1][3]);
                            mz = parseFloat(tf[2][3]);
                        }
                    }
                } catch (e) { continue; }

                if (mx === 0 && my === 0 && mz === 0) continue;

                let item = {
                    name: link.linkName || "未知",
                    level: translateLevel(link.levelName || "未知"),
                    x: mx.toFixed(1),
                    z: my.toFixed(1),
                    y: mz.toFixed(1)
                };

                if (link.enabled === true || link.enabled === 1 || link.enabled === "true") {
                    parsedData.enabled.push(item);
                } else {
                    parsedData.disabled.push(item);
                }
            }

            importBtn.innerText = "✅ 解析完成！点击重新导入";
            importBtn.style.backgroundColor = "#1e4d2b";
            
            searchBar.style.display = "block";
            tabs.style.display = "flex";
            
            tabAvail.innerText = `可用 (${parsedData.enabled.length})`;
            tabDis.innerText = `禁用 (${parsedData.disabled.length})`;
            
            switchTab('enabled');
        }

        tabAvail.addEventListener('click', () => switchTab('enabled'));
        tabDis.addEventListener('click', () => switchTab('disabled'));

        function switchTab(type) {
            currentTab = type;
            if (type === 'enabled') {
                tabAvail.className = "tab-btn active-avail";
                tabDis.className = "tab-btn";
            } else {
                tabAvail.className = "tab-btn";
                tabDis.className = "tab-btn active-dis";
            }
            renderList();
        }

        searchInput.addEventListener('input', () => {
            btnClear.style.display = searchInput.value ? "block" : "none";
            renderList();
        });

        btnClear.addEventListener('click', () => {
            searchInput.value = "";
            btnClear.style.display = "none";
            renderList();
        });

        function renderList() {
            listContainer.innerHTML = "";
            let sourceData = currentTab === 'enabled' ? parsedData.enabled : parsedData.disabled;
            
            let keyword = searchInput.value.trim().toLowerCase();
            if (keyword) {
                sourceData = sourceData.filter(item => 
                    item.name.toLowerCase().includes(keyword) || 
                    item.level.toLowerCase().includes(keyword)
                );
            }

            if (sourceData.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:#666; margin-top:50px;">没有找到匹配的传送点</div>`;
                return;
            }

            sourceData.forEach(item => {
                let card = document.createElement('div');
                card.className = `card ${currentTab}`;
                
                card.innerHTML = `
                    <div class="card-title">[${currentTab === 'enabled' ? '可用' : '不可用'}] ${item.name}</div>
                    <div class="card-level">目的地：${item.level}</div>
                    <div class="card-coord">坐标：X <span>${item.x}</span> | Z <span>${item.z}</span> | Y <span>${item.y}</span></div>
                `;

                bindCardEvents(card, item);
                listContainer.appendChild(card);
            });
        }

        function bindCardEvents(card, item) {
            let timer;
            const startPress = (e) => {
                createRipple(e, card);
                timer = setTimeout(() => {
                    copyToClipboard(item);
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 1000);
            };
            const endPress = () => clearTimeout(timer);

            card.addEventListener('touchstart', startPress, {passive: true});
            card.addEventListener('touchend', endPress);
            card.addEventListener('touchmove', endPress);
            card.addEventListener('mousedown', startPress);
            card.addEventListener('mouseup', endPress);
            card.addEventListener('mouseleave', endPress);
        }

        function createRipple(event, card) {
            const rect = card.getBoundingClientRect();
            let x, y;
            if (event.touches) {
                x = event.touches[0].clientX - rect.left;
                y = event.touches[0].clientY - rect.top;
            } else {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = ripple.style.height = '100px';
            ripple.style.marginLeft = '-50px';
            ripple.style.marginTop = '-50px';
            
            card.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        function copyToClipboard(item) {
            const text = `${item.name} | 目的地: ${item.level} | 坐标: X ${item.x}, Z ${item.z}, Y ${item.y}`;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showToast);
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy'); showToast(); } catch (err) {}
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
    </script>
</body>
</html>
